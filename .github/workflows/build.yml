name: Build Fanza Downloader APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/example/fanzadrive

          printf '%s\n' \
            'pluginManagement {' \
            '    repositories { google(); mavenCentral(); gradlePluginPortal() }' \
            '}' \
            'dependencyResolutionManagement {' \
            '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' \
            '    repositories { google(); mavenCentral() }' \
            '}' \
            'rootProject.name = "FanzaDriveDownloader"' \
            'include(":app")' > settings.gradle.kts

          printf '%s\n' \
            'plugins {' \
            '    id("com.android.application") version "8.2.2" apply false' \
            '    id("org.jetbrains.kotlin.android") version "1.9.22" apply false' \
            '}' > build.gradle.kts

          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' \
            'android.useAndroidX=true' \
            'android.nonTransitiveRClass=true' > gradle.properties

          printf '%s\n' \
            'plugins {' \
            '    id("com.android.application")' \
            '    id("org.jetbrains.kotlin.android")' \
            '}' \
            'android {' \
            '    namespace = "com.example.fanzadrive"' \
            '    compileSdk = 34' \
            '    defaultConfig {' \
            '        applicationId = "com.example.fanzadrive"' \
            '        minSdk = 26' \
            '        targetSdk = 34' \
            '        versionCode = 1' \
            '        versionName = "1.0"' \
            '    }' \
            '    compileOptions {' \
            '        sourceCompatibility = JavaVersion.VERSION_17' \
            '        targetCompatibility = JavaVersion.VERSION_17' \
            '    }' \
            '    kotlinOptions { jvmTarget = "17" }' \
            '}' \
            'dependencies {' \
            '    implementation("androidx.core:core-ktx:1.12.0")' \
            '    implementation("androidx.appcompat:appcompat:1.6.1")' \
            '    implementation("com.google.android.material:material:1.11.0")' \
            '    implementation("androidx.work:work-runtime-ktx:2.9.0")' \
            '    implementation("com.squareup.okhttp3:okhttp:4.12.0")' \
            '}' > app/build.gradle.kts

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools">' \
            '    <uses-permission android:name="android.permission.INTERNET" />' \
            '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' \
            '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />' \
            '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />' \
            '    <application android:allowBackup="true" android:label="FANZA Drive保存" android:supportsRtl="true" android:usesCleartextTraffic="true" android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">' \
            '        <activity android:name=".MainActivity" android:configChanges="orientation|screenSize|keyboardHidden" android:exported="true">' \
            '            <intent-filter>' \
            '                <action android:name="android.intent.action.MAIN" />' \
            '                <category android:name="android.intent.category.LAUNCHER" />' \
            '            </intent-filter>' \
            '        </activity>' \
            '        <service android:name="androidx.work.impl.foreground.SystemForegroundService" android:foregroundServiceType="dataSync" tools:node="merge" />' \
            '    </application>' \
            '</manifest>' > app/src/main/AndroidManifest.xml

          cat << 'END_KT' > app/src/main/java/com/example/fanzadrive/MainActivity.kt
          package com.example.fanzadrive
          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.Context
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.webkit.*
          import android.widget.*
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import androidx.work.*

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView
              private var lastClickedTitle: String? = null
              private var lastContentId: String? = null

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.POST_NOTIFICATIONS), 101)
                      }
                  }
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  val toolbar = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; setPadding(16, 16, 16, 16) }
                  val btnLibrary = Button(this).apply {
                      text = "購入済み一覧"
                      setOnClickListener { webView.loadUrl("https://www.dmm.co.jp/dc/doujin/-/mylibrary/") }
                  }
                  val btnSetting = Button(this).apply {
                      text = "保存先URL設定"
                      setOnClickListener { showUrlSettingDialog() }
                  }
                  toolbar.addView(btnLibrary, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  toolbar.addView(btnSetting, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  root.addView(toolbar)
                  webView = WebView(this)
                  root.addView(webView, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f))
                  setContentView(root)

                  val cookieManager = CookieManager.getInstance()
                  cookieManager.setAcceptCookie(true)
                  cookieManager.setAcceptThirdPartyCookies(webView, true)
                  webView.settings.apply { javaScriptEnabled = true; domStorageEnabled = true; loadWithOverviewMode = true; useWideViewPort = true }
                  webView.addJavascriptInterface(object {
                      @JavascriptInterface
                      fun setWorkInfo(title: String?, cid: String?) {
                          if (!title.isNullOrBlank()) lastClickedTitle = title.trim()
                          if (!cid.isNullOrBlank()) lastContentId = cid.trim()
                      }
                  }, "AndroidBridge")
                  webView.webViewClient = object : WebViewClient() {
                      override fun onPageFinished(view: WebView?, url: String?) {
                          super.onPageFinished(view, url)
                          CookieManager.getInstance().flush()
                          injectTitleExtractor()
                      }
                  }
                  webView.setDownloadListener { url, userAgent, contentDisposition, _, _ ->
                      val gasUrl = getSharedPreferences("fanza_prefs", Context.MODE_PRIVATE).getString("gas_url", "") ?: ""
                      val cookies = cookieManager.getCookie(url) ?: cookieManager.getCookie("https://www.dmm.co.jp") ?: ""
                      val cidMatch = Regex("(d_\\d+)").find(url) ?: Regex("(d_\\d+)").find(contentDisposition ?: "")
                      val cid = cidMatch?.groupValues?.get(1) ?: lastContentId ?: ""
                      val title = lastClickedTitle ?: ""
                      val inputData = workDataOf("DOWNLOAD_URL" to url, "COOKIES" to cookies, "USER_AGENT" to userAgent, "TITLE" to title, "CID" to cid, "GAS_URL" to gasUrl)
                      val request = OneTimeWorkRequestBuilder<UploadWorker>().setInputData(inputData).setExpedited(OutOfQuotaPolicy.RUN_AS_NON_EXPEDITED_WORK_REQUEST).build()
                      WorkManager.getInstance(this).enqueue(request)
                      val dispName = if (title.isNotBlank()) title else cid.ifBlank { "作品ファイル" }
                      Toast.makeText(this, "「$dispName」をバックグラウンド保存開始しました", Toast.LENGTH_LONG).show()
                  }
                  webView.loadUrl("https://www.dmm.co.jp/dc/doujin/-/mylibrary/")
              }

              private fun injectTitleExtractor() {
                  val js = "(function(){document.addEventListener('click',function(e){var a=e.target.closest('a');if(!a)return;var m=a.href.match(/(d_\\d+)/);var c=m?m[1]:'';var item=a.closest('li,tr,.d-item,.mylibraryList__item,div[class*=\"item\"]');var t='';if(item){var el=item.querySelector('.title,.d-itemTitle,h2,h3,[class*=\"title\"],[class*=\"Title\"]');if(el)t=el.innerText;}if(!t&&document.title){t=document.title.replace(/｜FANZA.*$/,'').replace(/- FANZA.*$/,'');}AndroidBridge.setWorkInfo(t,c);},true);})();"
                  webView.evaluateJavascript(js, null)
              }

              private fun showUrlSettingDialog() {
                  val prefs = getSharedPreferences("fanza_prefs", Context.MODE_PRIVATE)
                  val edit = EditText(this).apply { hint = "https://script.google.com/macros/s/.../exec"; setText(prefs.getString("gas_url", "")) }
                  AlertDialog.Builder(this).setTitle("Googleドライブ連携URL (GAS) 設定").setMessage("GASのウェブアプリURLを貼り付けてください（未設定でもスマホ内のDownload/FANZAフォルダにタイトル名で自動保存されます）").setView(edit).setPositiveButton("保存") { _, _ ->
                      prefs.edit().putString("gas_url", edit.text.toString().trim()).apply()
                      Toast.makeText(this, "保存しました", Toast.LENGTH_SHORT).show()
                  }.setNegativeButton("キャンセル", null).show()
              }

              override fun onBackPressed() { if (webView.canGoBack()) webView.goBack() else super.onBackPressed() }
          }
          END_KT

          cat << 'END_WORKER' > app/src/main/java/com/example/fanzadrive/UploadWorker.kt
          package com.example.fanzadrive
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.content.ContentValues
          import android.content.Context
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.Environment
          import android.provider.MediaStore
          import android.util.Base64
          import androidx.core.app.NotificationCompat
          import androidx.work.CoroutineWorker
          import androidx.work.ForegroundInfo
          import androidx.work.WorkerParameters
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody.Companion.toRequestBody
          import org.json.JSONObject
          import java.io.File
          import java.io.FileOutputStream
          import java.util.concurrent.TimeUnit

          class UploadWorker(private val ctx: Context, params: WorkerParameters) : CoroutineWorker(ctx, params) {
              private val client = OkHttpClient.Builder().connectTimeout(120, TimeUnit.SECONDS).readTimeout(300, TimeUnit.SECONDS).writeTimeout(300, TimeUnit.SECONDS).followRedirects(true).followSslRedirects(true).build()

              override suspend fun getForegroundInfo(): ForegroundInfo {
                  val channelId = "fanza_dl_channel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(channelId, "FANZA 自動保存", NotificationManager.IMPORTANCE_LOW)
                      (ctx.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager).createNotificationChannel(channel)
                  }
                  val notif = NotificationCompat.Builder(ctx, channelId).setContentTitle("FANZA同人 自動保存中").setContentText("バックグラウンドでダウンロード・リネーム中...").setSmallIcon(android.R.drawable.stat_sys_download).setOngoing(true).build()
                  return if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) ForegroundInfo(1001, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC) else ForegroundInfo(1001, notif)
              }

              override suspend fun doWork(): Result = withContext(Dispatchers.IO) {
                  try { setForeground(getForegroundInfo()) } catch (_: Exception) {}
                  val dlUrl = inputData.getString("DOWNLOAD_URL") ?: return@withContext Result.failure()
                  val cookies = inputData.getString("COOKIES") ?: ""
                  val ua = inputData.getString("USER_AGENT") ?: "Mozilla/5.0"
                  var title = inputData.getString("TITLE") ?: ""
                  var cid = inputData.getString("CID") ?: ""
                  val gasUrl = inputData.getString("GAS_URL") ?: ""

                  val tempFile = File(ctx.cacheDir, "temp_${System.currentTimeMillis()}.zip")
                  try {
                      val req = Request.Builder().url(dlUrl).header("Cookie", cookies).header("User-Agent", ua).build()
                      client.newCall(req).execute().use { res ->
                          if (!res.isSuccessful) return@withContext Result.failure()
                          val finalUrl = res.request.url.toString()
                          val disp = res.header("Content-Disposition") ?: ""
                          if (cid.isBlank()) {
                              val m = Regex("(d_\\d+)").find(finalUrl) ?: Regex("(d_\\d+)").find(disp)
                              if (m != null) cid = m.groupValues[1]
                          }
                          val body = res.body ?: return@withContext Result.failure()
                          FileOutputStream(tempFile).use { out -> body.byteStream().copyTo(out) }
                      }
                      if (title.isBlank() || title.contains("マイライブラリ") || title.contains("購入済み")) {
                          if (cid.isNotBlank()) title = fetchTitleFromDetail(cid) ?: cid
                      }
                      val safeTitle = title.ifBlank { cid.ifBlank { "FANZA_${System.currentTimeMillis()}" } }.replace(Regex("[\\\\/:*?\"<>|]"), " ").trim()
                      val finalFileName = "$safeTitle.zip"

                      saveToDownloads(tempFile, finalFileName)

                      if (gasUrl.isNotBlank() && tempFile.length() < 36 * 1024 * 1024) {
                          val b64 = Base64.encodeToString(tempFile.readBytes(), Base64.NO_WRAP)
                          val json = JSONObject().apply { put("fileName", finalFileName); put("contentId", cid); put("fileData", b64) }
                          val postReq = Request.Builder().url(gasUrl).post(json.toString().toRequestBody("application/json; charset=utf-8".toMediaType())).build()
                          client.newCall(postReq).execute().close()
                      }
                      showCompleteNotification(finalFileName)
                      Result.success()
                  } catch (e: Exception) {
                      Result.failure()
                  } finally {
                      if (tempFile.exists()) tempFile.delete()
                  }
              }

              private fun fetchTitleFromDetail(cid: String): String? {
                  return try {
                      val req = Request.Builder().url("https://www.dmm.co.jp/dc/doujin/-/detail/=/cid=$cid/").header("Cookie", "age_check_done=1").build()
                      client.newCall(req).execute().use { res ->
                          val html = res.body?.string() ?: return null
                          val m = Regex("<meta property=\"og:title\" content=\"([^\"]+)\"", RegexOption.IGNORE_CASE).find(html) ?: Regex("<h1[^>]*class=\"productTitle__txt\"[^>]*>([\\s\\S]*?)</h1>", RegexOption.IGNORE_CASE).find(html)
                          m?.groupValues?.get(1)?.replace(Regex("<[^>]+>"), "")?.replace(Regex("｜FANZA同人$"), "")?.replace(Regex(" - FANZA同人$"), "")?.trim()
                      }
                  } catch (_: Exception) { null }
              }

              private fun saveToDownloads(source: File, fileName: String) {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          val values = ContentValues().apply {
                              put(MediaStore.Downloads.DISPLAY_NAME, fileName)
                              put(MediaStore.Downloads.MIME_TYPE, "application/zip")
                              put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/FANZA")
                          }
                          val resolver = ctx.contentResolver
                          val uri = resolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)
                          if (uri != null) resolver.openOutputStream(uri)?.use { out -> source.inputStream().use { it.copyTo(out) } }
                      }
                  } catch (_: Exception) {}
              }

              private fun showCompleteNotification(fileName: String) {
                  val nm = ctx.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  val notif = NotificationCompat.Builder(ctx, "fanza_dl_channel").setContentTitle("保存完了").setContentText(fileName).setSmallIcon(android.R.drawable.stat_sys_download_done).setAutoCancel(true).build()
                  nm.notify(System.currentTimeMillis().toInt(), notif)
              }
          }
          END_WORKER

          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FanzaDriveDownloader-APK
          path: app/build/outputs/apk/debug/app-debug.apk
