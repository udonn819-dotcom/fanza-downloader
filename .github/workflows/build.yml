name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # （任意）GitHub Secrets に SIGNING_KEYSTORE_BASE64 などを登録すると独自の署名鍵を使います
      - name: Prepare custom signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/custom.keystore"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/custom.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/FanzaDrive-v1.0.${{ github.run_number }}.apk"
          (cd pc-extension && zip -r "../dist/FanzaDrive-PC.zip" .)

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: FanzaDrive-apk
          path: dist/*

      # スマホから直接ダウンロードしやすいよう「Releases」にもAPKを置く
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FANZA Drive保存 v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          files: dist/*
          body: |
            ブランチ: ${{ github.ref_name }}
            スマホでこのページを開き、下の「Assets」から .apk をタップしてインストールしてください。
            パソコンで保存したい場合は「FanzaDrive-PC.zip」をダウンロードしてください（使い方はREADMEの「パソコンで保存する」）。
