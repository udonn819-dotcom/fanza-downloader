<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  body { font-family: system-ui, sans-serif; width: 340px; margin: 0; padding: 14px; font-size: 13px; color: #222; }
  h1 { font-size: 15px; margin: 0 0 10px; color: #e5004f; }
  button { width: 100%; padding: 9px; margin: 4px 0; font-size: 13px; border-radius: 6px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
  button.primary { background: #e5004f; color: #fff; border: none; font-weight: bold; }
  .box { background: #f6f6f6; border-radius: 6px; padding: 8px; margin: 8px 0; white-space: pre-wrap; line-height: 1.5; }
  label { display: block; margin: 6px 0; }
  .small { font-size: 11px; color: #666; }
</style>
</head>
<body>
  <h1>FANZA同人 一括保存（PC）</h1>
  <button id="start" class="primary">▶ 一括保存を開始</button>
  <button id="stop">■ 停止</button>
  <label>同時ダウンロード数
    <select id="parallel">
      <option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option>
    </select>
  </label>
  <div id="status" class="box">読み込み中…</div>
  <button id="downloads">Chromeのダウンロード画面を開く（失敗分の「再開」）</button>
  <hr>
  <div class="small">スマホアプリの「設定」→「PCへ引き継ぐ」で作ったファイルを読み込むと、スマホで保存済みの作品を飛ばします。</div>
  <input type="file" id="importFile" accept=".json,application/json" style="margin:6px 0">
  <div id="importResult" class="small"></div>
  <hr>
  <button id="clear">今回の表示をリセット</button>
  <button id="reset">保存済み記録をすべて消す</button>
  <script src="popup.js"></script>
</body>
</html>
